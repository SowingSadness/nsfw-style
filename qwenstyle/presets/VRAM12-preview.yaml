# VRAM12-preview: 12 GB VRAM / 32 GB RAM — черновик 768p на базовом Qwen без LoRA (FUSAL 0.0).
# 768p (1376x768 при 16:9) + `offload: group`: пик ≈8 ГиБ, поэтому черновик влезает в 12 ГБ
# (`offload: none` давал 15.5 ГиБ — это 16 ГБ, а не 12); 8 шагов дают кадр за ~12-15 s.
# Апскейла нет (target_height 0). Энкодер heretic — `auto` (GPU + конвейер стриминга на CUDA).
extends: base

encoder:
  name: heretic
  cache_tag: heretic      # -> _te-heretic (на CUDA ещё и -dev-cuda)
  device: auto            # 12 ГБ: энкод идёт на GPU, стриминг включается сам
  stream: true
  prefetch: 4

generation:
  steps: 8
  offload: group          # 768p + group: пик ≈8 ГиБ, влезает в 12 ГБ (с offload: none было 15.5 ГиБ — это 16 ГБ, а не 12)
  kv_cache: offload    # KV префикса в RAM: при 960p/1440p он занимает 3.7–7.8 ГиБ VRAM и выбивает тариф; бит-в-бит, +13 % времени (docs/bench/kv-cache-offload.md)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.0            # FUSAL выключена: обычный профиль, не anime

size_px: 768              # 768p: 1376x768 при 16:9

upscale:
  backend: esrgan
  factor: 0
  target_height: 0        # черновик без апскейла

# flagship-r3-169: Qwen-Image-2.1 без LoRA, **три референса**, 16:9, максимальный кадр,
# который влезает в 16 ГиБ. Пресет-ответ на потолок энкодера Qwen3VL-8B: референсы ресайзятся
# в размер кадра, поэтому цена энкода растёт как 3 × W × H, а не как один кадр.
#
# Замеры (4080 16 ГиБ, 3 референса, энкодер heretic на GPU, fp8-трансформер, `offload: group`):
#   1632x928                -> ок: 97.6 s на 25 шагов, пик 7.8 ГиБ
#   1664x928 (size_px 928)  -> OOM на [4/5] кодировании промта (не хватает ~1 ГиБ)
#   1920x1088 (size_px 1088) -> OOM на кодировании (нужно 6.37 ГиБ при 1.44 свободных)
#   2592x1440                -> OOM на кодировании (один тензор 17.07 ГиБ)
# То есть потолок ~1.52 Мпикс на референс при трёх референсах; на двух и одном он выше.
#
# Сетка кадра кратна 32 px, поэтому с зафиксированным 16:9 доступны высоты 896 и 928:
# 928 даёт 1664x928 (OOM), 912 снапится в 896 -> 1632x896 (1.46 Мпикс) — это и есть максимум
# под пином пропорции. Без пина `aspect` тот же `size_px` дал бы 1632x928 (пропорция входа 1.79).
#
# Цепочка вывода: 1632x896 -> ESRGAN x2.41 (2160 / 896) -> 3934x2160 (тот же 4K-таргет профиля).
# 25 шагов — как у релизных пресетов; 8 шагов только для черновиков (`--preview`).
extends: base

generation:
  steps: 25
  offload: group          # 3 референса + 1632x928 без offload в 16 ГиБ не влезают
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.0            # FUSAL выключена: обычный профиль, не anime

size_px: 912              # 16:9 -> crop 1632x896 (максимум под пином пропорции для 3 рефов)
aspect: "16:9"            # пропорция кадра пинится пресетом, чтобы не зависеть от пропорции входа

upscale:
  backend: esrgan
  factor: 0               # фактор считается из target_height: 2160 / 896 = 2.41
  target_height: 2160

# strong-release: 16 GB VRAM / 32 GB RAM — финальный кадр 960p на базовом Qwen без LoRA (FUSAL 0.0).
# 960p (1696x960 при 16:9) без offload даёт OOM, поэтому `offload: group` + один блок на GPU:
# ~66 s на 25 шагов при пике ~10.8 ГиБ. Дальше ESRGAN x1.5 до 1440p: 1440 / 960.
# Энкодер heretic — `auto` (GPU + конвейер стриминга), 25 шагов — полный профиль модели.
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.0            # FUSAL выключена: обычный профиль, не anime

size_px: 960              # 960p: 1696x960 при 16:9

upscale:
  backend: esrgan
  factor: 0               # фактор считается из target_height: 1440 / 960 = 1.5
  target_height: 1440     # целевой кадр strong-профиля (~2544x1440 при 16:9)

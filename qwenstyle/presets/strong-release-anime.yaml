# strong-release-anime: 16 GB VRAM / 32 GB RAM — финальный кадр 960p + FUSAL 0.7, 25 шагов.
# 960p (1696x960 при 16:9) требует `offload: group` (без него OOM), дальше ESRGAN x1.5 до 1440p.
# 25 шагов — полный профиль базовой модели; LoRA 0.7 — диапазон переноса стиля (AGENTS.md §5.6).
# Энкодер heretic — `auto` (GPU + конвейер стриминга на CUDA).
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.7

size_px: 960              # 960p: 1696x960 при 16:9

upscale:
  backend: esrgan
  factor: 0               # фактор считается из target_height: 1440 / 960 = 1.5
  target_height: 1440     # целевой кадр strong-профиля (~2544x1440 при 16:9)

# VRAM16-release: 16 GB VRAM / 64 GB RAM — финальный кадр 1440p native без LoRA (FUSAL 0.0).
# 1440p (2560x1440 при 16:9, 10800 токенов) — спилл активаций: 16-17 s/шаг, 25 шагов ~7 мин,
# поэтому обязательны `offload: group`, `kv_cache: offload` (KV в RAM) и свободная RAM
# (иначе 70 s/шаг, AGENTS.md §4).
# Цепочка: 1440p native -> `upscale: null` -> 2560x1440 (4K — `--upscale 1.5` до 3840x2160).
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group          # без offload 1440p не стартует
  kv_cache: offload    # KV префикса в RAM: при 960p/1440p он занимает 3.7–7.8 ГиБ VRAM и выбивает тариф; бит-в-бит, +13 % времени (docs/bench/kv-cache-offload.md)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.0            # FUSAL выключена: обычный профиль, не anime

size_px: 1440             # 1440p native: 2560x1440 при 16:9

upscale: null              # без апскейла: native 960p (у VRAM16 — 1440p). Включить: --upscale 1.5
                           # или --set post.upscale.esrgan.target_height=…; factor: 0 сам апскейл НЕ выключает

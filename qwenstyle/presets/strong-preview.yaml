# strong-preview: 16 GB VRAM / 32 GB RAM — черновик 768p на базовом Qwen без LoRA (FUSAL 0.0).
# 768p (1376x768 при 16:9) — верхняя сетка, которая влезает в 16 ГиБ без offload, поэтому
# `offload: none` и полная скорость; 8 шагов дают кадр за ~12-15 s, 25 нужны только финалу.
# Апскейла нет (target_height 0). Энкодер heretic — `auto` (GPU + конвейер стриминга на CUDA).
extends: base

encoder:
  name: heretic
  cache_tag: heretic      # -> _te-heretic (на CUDA ещё и -dev-cuda)
  device: auto            # 16 ГиБ: энкод идёт на GPU, стриминг включается сам
  stream: true
  prefetch: 4

generation:
  steps: 8
  offload: none           # 768p влезает без offload (пик 15.5 ГиБ)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.0            # FUSAL выключена: обычный профиль, не anime

size_px: 768              # 768p: 1376x768 при 16:9

upscale:
  backend: esrgan
  factor: 0
  target_height: 0        # черновик без апскейла

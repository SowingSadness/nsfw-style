# VRAM16-release-anime: 16 GB VRAM / 64 GB RAM — финальный кадр 1440p native + FUSAL 0.7.
# Нативный 1440p (2560x1440 при 16:9) — тот же спилл активаций, что у `VRAM16-release`:
# 16-17 s/шаг и `offload: group` + `kv_cache: offload` обязательны (см. AGENTS.md §4).
# Цепочка: 1440p native -> `upscale: null` -> 2560x1440 (4K — `--upscale 1.5`); 25 шагов — полный профиль.
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group          # без offload 1440p не стартует
  kv_cache: offload    # KV префикса в RAM: при 960p/1440p он занимает 3.7–7.8 ГиБ VRAM и выбивает тариф; бит-в-бит, +13 % времени (docs/bench/kv-cache-offload.md)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.7

size_px: 1440             # 1440p native: 2560x1440 при 16:9

upscale: null              # без апскейла: native 960p (у VRAM16 — 1440p). Включить: --upscale 1.5
                           # или --set post.upscale.esrgan.target_height=…; factor: 0 сам апскейл НЕ выключает

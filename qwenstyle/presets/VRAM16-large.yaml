# VRAM16-large: 16 GB VRAM / 64 GB RAM — 1792p со скользящим окном внимания (Context Windows).
# 1792p 16:9 = 3200x1792 (22400 токенов) — выше привычной полосы 1440p. Нативное внимание на этом
# кадре: 376 s при пике 10.3 ГиБ; скользящее окно 384 px + запас 384 px: 314 s при том же VRAM,
# без швов и без артефактов тайлинга (README, «Скользящее окно внимания»).
# Полоса видит 14 400 из 22 400 целевых токенов (64 %): порог режима — не меньше ~⅔ канваса,
# при 36 % модель дорисовывает в каждой полосе свою сцену и кадр размножается.
# Референсы считаются на сетке 960p (`ref_px`), а не канваса: на сетке канваса энкодер Qwen3VL-8B
# падает в OOM на фазе [4/5] задолго до генерации (см. комментарии в VRAM16-r3-*).
# LoRA FUSAL 0.0 — обычный профиль, стиль не навязывается.
# Цепочка: 1792p native -> `upscale: null` -> 3200x1792
# (2160 по высоте — `--upscale 1.2`, 4K UHD — `--upscale 1.35`).
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group          # 1792p без offload не влезает
  kv_cache: offload       # KV префикса в RAM: бит-в-бит, +13 % времени (docs/bench/kv-cache-offload.md)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    ref_px: 960                   # сетка референсов: иначе энкодер падает в OOM
    window_attn_px: 384           # высота полосы внимания; >= высоты кадра = нативное плотное
    window_attn_margin_px: 384    # запас строк: держать покрытие >= ⅔ канваса
  lora:
    scale: 0.0

size_px: 1792             # 1792p native: 3200x1792 при 16:9

upscale: null             # без апскейла: кадр отдаётся native; включить — --upscale 1.2 (2160p)

# qwen-2k: Qwen-Image-2.1 + FUSAL R80 — НАТИВНЫЙ кадр 1440p, БЕЗ апскейла.
# Зачем: финальный 1440p отдаёт сама модель (а не ESRGAN ×1.33 из 1080p), поэтому мелкая
# текстура настоящая. Плата — активации растут с площадью кадра: 16:9 1440p (2560×1440,
# 14400 токенов) в 16 ГиБ не влезает даже с offload, портретный кадр (≈1216×1440,
# ~7900 токенов) влезает только с `offload: group`. Для 16:9 берите `--size 1080p`.
#
# Отличия от `anime`: size_px 1440 вместо 1080, апскейл выключен целиком
# (`factor: 0` И `target_height: 0`), LoRA берётся из `anime` (0.3) — промт FUSAL-формата,
# поэтому адаптер должен быть включён; энкодер тоже из `anime` (штатный Qwen3VL-8B,
# легаси-имя кэша без `_te-*`).
extends: anime

size_px: 1440

upscale:
  backend: esrgan
  factor: 0.0            # апскейл выключен: кадр отдаёт сама модель
  target_height: 0       # иначе anime/base подставят 1440 и ESRGAN всё равно включится

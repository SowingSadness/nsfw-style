# max-h3: MiniMax-H3-Image на максимальном рабочем кадре для 16 ГиБ — 3072p (4096x3072).
#
# Шагов у H3 нет: 6 фиксированных PDD-шагов (`num_inference_steps` пайплайн игнорирует), поэтому
# `--steps`/`generation.steps` к этому пресету неприменимы — разрешение здесь единственный рычаг.
#
# Замеры (4080 16 ГиБ, edit по 1920x1440, seed 20261113, `offload: group`, fp8 30.9 ГиБ):
#   1440p -> 1920x1440   165 s
#   1792p -> 2400x1792   174 s
#   2048p -> 2720x2048   182 s
#   2560p -> 3424x2560   204 s
#   3072p -> 4096x3072   237 s   <- этот пресет
#   4096p -> 5472x4096   генерация и VAE-декод проходят, падает постобработка:
#                        `_ArrayMemoryError: Unable to allocate 256 MiB for (1, 4096, 5472, 3)
#                        float32` — это хостовая RAM (fp8-трансформер 30.9 ГиБ уже лежит в ней),
#                        а не VRAM; 4096p для этого пресета — задача на будущее.
#
# Пропорция кадра не пинится: в edit-режиме она берётся из референса, в T2I задаётся `--aspect`
# (16:9 | 4:3 | 1:1 | 2:3). Апскейл не включается (`upscale` наследуется от `h3-image`).
extends: h3-image

size_px: 3072

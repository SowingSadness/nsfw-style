# flagship-r3-43: Qwen-Image-2.1 без LoRA, **три референса**, 4:3, максимальный кадр,
# который влезает в 16 ГиБ. Отличие от flagship-r3-169 — только пропорция и, как следствие,
# максимальная высота: у 4:3 при том же потолке площади кадр выше (1408x1056 против 1632x928).
#
# Замеры (4080 16 ГиБ, 3 референса, энкодер heretic на GPU, fp8-трансформер, `offload: group`):
#   1376x1024 (size_px 1024) -> ок (7.5 ГиБ, 89-91 s на 25 шагов)
#   1408x1056 (size_px 1056) -> ок: 94.7 s на 25 шагов, пик 7.8 ГиБ
#   1440x1072 (size_px 1072) -> OOM на [4/5] кодировании промта (не хватает ~1 ГиБ)
#   1696x1280 (size_px 1280) -> OOM на кодировании (нужно 6.52 ГиБ при 1.27 свободных)
# Потолок — площадь: ~1.5 Мпикс на референс при трёх референсах (см. комментарий в 169-пресете).
#
# Цепочка вывода: 1408x1056 -> ESRGAN x2.045 (2160 / 1056) -> 2880x2160 (4:3, высота профиля).
extends: base

generation:
  steps: 25
  offload: group          # 3 референса + 1408x1056 без offload в 16 ГиБ не влезают
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.0            # FUSAL выключена: обычный профиль, не anime

size_px: 1056             # 4:3 -> crop 1408x1056 (проверенный максимум для 3 референсов)
aspect: "4:3"             # пропорция кадра пинится пресетом, чтобы не зависеть от пропорции входа

upscale:
  backend: esrgan
  factor: 0               # фактор считается из target_height: 2160 / 1056 = 2.045
  target_height: 2160

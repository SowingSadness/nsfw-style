# 4K-slide: 16 GB VRAM / 64 GB RAM — 4K UHD (3840x2176) на Qwen-Image-2.1 со скользящим окном внимания.
# Канвас 8.3 Мп = 240x136 латентов = 32640 токенов: нативное плотное внимание на таком кадре
# упирается в VRAM, поэтому включается скользящее окно внимания (Context Windows): кадр считается
# один раз целиком, режется только сам attention.
# Геометрия окна: полоса 1088 px (= ровно 1080p по высоте) + запас 448 px -> 2 полосы по 136 строк,
# каждая видит 29760 из 32640 целевых токенов (91 %). Порог режима — не меньше ~⅔ канваса
# (при 36 % модель дорисовывает в каждой полосе свою сцену и кадр размножается, README).
# Референсы считаются на сетке 960p (`ref_px`): на сетке канваса энкодер Qwen3VL-8B падает в OOM
# на фазе [4/5] задолго до генерации.
# Замер (4080 16 ГиБ, 2 референса, 2 шага): 56 s, пик 13.9 ГиБ. Полный прогон 25 шагов — см. README.
# LoRA FUSAL 0.0 — обычный профиль. Апскейл выключен: 4K отдаётся native.
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group          # без offload 4K не стартует
  kv_cache: offload       # KV префикса в RAM: бит-в-бит, +13 % времени (docs/bench/kv-cache-offload.md)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    ref_px: 960                   # сетка референсов: иначе энкодер падает в OOM
    window_attn_px: 1088          # высота полосы внимания = 1080p; >= высоты кадра даёт нативное
    window_attn_margin_px: 448    # запас строк: держит покрытие 91 % (порог режима ~⅔)
  lora:
    scale: 0.0

size_px: 2160             # 4K UHD: 3840x2176 при 16:9 (кратность 16 px даёт 2176 по высоте)

upscale: null             # без апскейла: 4K отдаётся native (нужны 8K — --upscale 2)

# demo: быстрая демонстрация — рендер 960p (1728x960), затем апскейл Real-ESRGAN x4
# с ресемплом до высоты 1440 (2592x1440). Дешевле полного 1440p: 960p считается 53 с
# вместо 111 с, а ESRGAN добавляет ~1.5 с и <1 GiB VRAM.
#
# Замеры: 960p без offload — генерация 53 с, пик VRAM 15669 MiB; offload не нужен.
# Для финального качества лучше presets/full-flux2.yaml (нативный 1440p + offload).
extends: flux2

size_px: 960

generation:
  steps: 8

upscale:
  backend: esrgan          # x4plus_anime_6B; seedvr2 — флагом --upscale-backend
  factor: 0.0               # factor считается из target_height: 1440 / 960 = 1.5
  target_height: 1440       # фиксированная высота финального кадра (2592x1440 при 16:9)

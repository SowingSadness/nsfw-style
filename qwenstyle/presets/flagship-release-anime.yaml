# flagship-release-anime: 16 GB VRAM / 64 GB RAM — финальный кадр 4K UHD, 1440p + FUSAL 0.7.
# Нативный 1440p (2560x1440 при 16:9) — тот же спилл активаций, что у `flagship-release`:
# 16-17 s/шаг и `offload: group` обязателен (см. AGENTS.md §4).
# Цепочка: 1440p native -> ESRGAN x1.5 (2160 / 1440) -> 3840x2160; 25 шагов — полный профиль.
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group          # без offload 1440p не стартует
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.7

size_px: 1440             # 1440p native: 2560x1440 при 16:9

upscale:
  backend: esrgan
  factor: 0               # фактор считается из target_height: 2160 / 1440 = 1.5
  target_height: 2160     # целевой кадр flagship-профиля (4K UHD: 3840x2160 при 16:9)

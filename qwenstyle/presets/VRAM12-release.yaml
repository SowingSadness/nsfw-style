# VRAM12-release: 12 GB VRAM / 32 GB RAM — финальный кадр 960p на базовом Qwen без LoRA (FUSAL 0.0).
# 960p (1696x960 при 16:9) без offload даёт OOM, поэтому `offload: group` + один блок на GPU:
# ~66 s на 25 шагов при пике ~10.8 ГиБ, KV префикса — в RAM (`kv_cache: offload`).
# `upscale: null` — кадр отдаётся native 1696x960 (включить: `--upscale 1.5`).
# Энкодер heretic — `auto` (GPU + конвейер стриминга), 25 шагов — полный профиль модели.
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 25
  offload: group
  kv_cache: offload    # KV префикса в RAM: при 960p/1440p он занимает 3.7–7.8 ГиБ VRAM и выбивает тариф; бит-в-бит, +13 % времени (docs/bench/kv-cache-offload.md)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.0            # FUSAL выключена: обычный профиль, не anime

size_px: 960              # 960p: 1696x960 при 16:9

upscale: null              # без апскейла: native 960p (у VRAM16 — 1440p). Включить: --upscale 1.5
                           # или --set post.upscale.esrgan.target_height=…; factor: 0 сам апскейл НЕ выключает

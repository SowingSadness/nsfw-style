# VRAM12-preview-anime: 12 GB VRAM / 32 GB RAM — черновик 768p на базовом Qwen + FUSAL 0.7.
# 768p (1376x768 при 16:9) + `offload: group`: пик ≈8 ГиБ, влезает в 12 ГБ (с `offload: none`
# было 15.5 ГиБ — это 16 ГБ, а не 12); 8 шагов и полная скорость адаптера.
# LoRA 0.7 — рабочий диапазон переноса стиля/правки (AGENTS.md §5.6); апскейла нет (target_height 0).
# Энкодер heretic — `auto` (GPU + конвейер стриминга на CUDA).
extends: base

encoder:
  name: heretic
  cache_tag: heretic
  device: auto
  stream: true
  prefetch: 4

generation:
  steps: 8
  offload: group          # 768p + group: пик ≈8 ГиБ, влезает в 12 ГБ (с offload: none было 15.5 ГиБ — это 16 ГБ, а не 12)
  kv_cache: offload    # KV префикса в RAM: при 960p/1440p он занимает 3.7–7.8 ГиБ VRAM и выбивает тариф; бит-в-бит, +13 % времени (docs/bench/kv-cache-offload.md)
  precision_cache: cache/models/fp8_transformer
  sampler_kwargs:
    offload_blocks: 1
  lora:
    scale: 0.7

size_px: 768              # 768p: 1376x768 при 16:9

upscale:
  backend: esrgan
  factor: 0
  target_height: 0        # черновик без апскейла
